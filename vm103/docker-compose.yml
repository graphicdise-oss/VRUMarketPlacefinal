# VRU Marketplace — Backend Production Deployment (VM 103: 172.16.90.103)
# เชื่อมต่อไปยัง PostgreSQL บน VM 104 (172.16.90.104)
# เปิดพอร์ต 3001 เพื่อให้ VM 101 (NPM Gateway) เชื่อมต่อได้

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  # รัน Migration ตารางฐานข้อมูลไปยัง VM 104 แล้วจบการทำงาน
  migrate:
    build:
      context: .
      target: build
    env_file:
      - .env
    command: npx prisma migrate deploy
    restart: 'no'
    logging: *logging

  # ตัว NestJS API
  api:
    build:
      context: .
      target: runtime
    container_name: vru-marketplace-backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      UPLOAD_DIR: /var/lib/vru-marketplace/uploads
      PORT: '3000'
      NODE_ENV: production
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MALLOC_ARENA_MAX: '2'
    ports:
      - '3001:3000'
    volumes:
      - uploads:/var/lib/vru-marketplace/uploads
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3000/api/v1/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: ${API_MEMORY_LIMIT:-1g}
    logging: *logging

volumes:
  uploads:
