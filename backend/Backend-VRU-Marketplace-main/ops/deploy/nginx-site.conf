# VRU Marketplace — the one Nginx in front of the API and the frontend (§99).
#
# For an Nginx installed on the server itself, next to docker compose:
#   /etc/nginx/sites-available/vru-marketplace  →  symlinked into sites-enabled/
# Replace the three things marked CHANGE ME, then `nginx -t && systemctl reload nginx`.
# ops/deploy/README.md has the whole sequence and what to ask IT first.
#
# One domain, split by path (N9 · DECISIONS.md §60): `/api/v1/` goes to the API, everything else is
# the frontend. The login cookies are SameSite=Lax and host-only, and chat refuses a handshake whose
# Origin is not FRONTEND_BASE_URL — so the frontend and the API must be served from this one host.

# WebSocket upgrades need `Connection: upgrade`; every other request to the upstream gets an empty
# Connection header so the keepalive pool below actually keeps connections alive.
map $http_upgrade $vru_connection {
    default upgrade;
    ''      '';
}

upstream vru_api {
    # docker-compose.yml publishes the API on loopback only; this is the one way in. The same fixed
    # 3000 as there — change both together.
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    # IPv4 only: `listen [::]:80` stops Nginx from starting at all on a machine with IPv6 turned
    # off (seen while testing this file). Add the [::] lines back if IT says the server has IPv6.
    listen 80;
    server_name market.example.ac.th;  # CHANGE ME (1/3) — the real domain, same as FRONTEND_BASE_URL

    # Let certbot's HTTP-01 challenge through if IT issues the certificate that way; everything
    # else goes to HTTPS. Plain HTTP cannot work anyway: in production the session cookies are
    # Secure, and a browser drops them on an http:// page.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2` on the listen line rather than `http2 on;`, which Nginx before 1.25.1 (Ubuntu 24.04
    # ships 1.24) does not know. Newer versions only warn that this spelling is deprecated.
    listen 443 ssl http2;
    server_name market.example.ac.th;  # CHANGE ME (1/3) — same as above

    # CHANGE ME (2/3) — wherever IT or certbot puts the certificate for this domain.
    ssl_certificate     /etc/ssl/vru-marketplace/fullchain.pem;
    ssl_certificate_key /etc/ssl/vru-marketplace/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;

    # Browsers remember to use HTTPS for a year. Deliberately without includeSubDomains: other
    # sites on the university's domain are not ours to decide for.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    # --- The API --------------------------------------------------------------------------

    # Set once for every location that proxies, so no location can forget one. A location that
    # sets any proxy_set_header of its own stops inheriting ALL of these — keep them here.
    proxy_http_version 1.1;
    # Empty for an ordinary request (Nginx does not send an empty header), `websocket` for chat.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $vru_connection;
    proxy_set_header Host $host;
    # APPENDS the address this Nginx saw to whatever the caller sent. The API trusts exactly
    # TRUST_PROXY_HOPS entries from the right (1 for this Nginx alone), so what a caller writes
    # into the header is never taken as their address — the rate limits and the access log
    # (§98, พ.ร.บ.คอมพิวเตอร์ ม.26) depend on that. If IT puts another proxy in front of this one,
    # it must append too, and TRUST_PROXY_HOPS becomes 2.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Chat (#66): socket.io under the API prefix, which upgrades to a WebSocket. Without the
    # Upgrade/Connection headers above the handshake still succeeds over long-polling, so chat looks
    # like it works while every message waits for a round of polling — easy to miss on deploy.
    location /api/v1/socket.io/ {
        proxy_pass http://vru_api;
        # socket.io pings every 25s; an idle socket must outlive that, or Nginx cuts every quiet
        # conversation after its 60s default and the client reconnects in a loop.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # The only two requests that carry many photos at once: a dispute's evidence, from the buyer
    # and from the shop — up to MAX_EVIDENCE_FILES (10) × MAX_IMAGE_UPLOAD_BYTES (10MB). Raise this
    # with either of them.
    #
    # Only here, not on the whole API: the API holds an upload in memory while it re-encodes it,
    # and 110MB on every route would let any upload endpoint ask for ten times what it can use
    # (§99 — measured, see ops/deploy/README.md).
    location ~ ^/api/v1/(orders/[^/]+/dispute|shops/me/orders/[^/]+/dispute/respond)$ {
        proxy_pass http://vru_api;
        client_max_body_size 110m;
    }

    location /api/v1/ {
        proxy_pass http://vru_api;
        # Every other upload is one photo of at most 10MB, plus the multipart envelope around it.
        # Nginx's own default is 1MB, which would refuse nearly every phone photo with a 413 that
        # never reaches the API.
        client_max_body_size 11m;
    }

    # A body over the limits above never reaches the API, so Nginx answers it — in the API's own
    # error shape (L4) and with the same code the API uses for a file over its own ceiling, so the
    # frontend's one error handler needs no special case for "refused at the door". No
    # `fieldErrors`: the API omits it when empty, since `{}` reads as "there are field errors".
    error_page 413 = @payload_too_large;
    location @payload_too_large {
        default_type application/json;
        return 413 '{"code":"PAYLOAD_TOO_LARGE","message":"ไฟล์หรือข้อมูลที่ส่งมามีขนาดใหญ่เกินกำหนด"}';
    }

    # The generated API document is not served in production (NODE_ENV=production in
    # docker-compose.yml); this only makes sure a proxy change never exposes it.
    location /api/v1/docs {
        return 404;
    }

    # --- The frontend ---------------------------------------------------------------------

    # CHANGE ME (3/3) — the frontend's built files (a separate repository). A single-page app:
    # any path that is not a file gets index.html, and the frontend's router takes it from there.
    location / {
        root /var/www/vru-marketplace/frontend;
        try_files $uri $uri/ /index.html;
    }
}
