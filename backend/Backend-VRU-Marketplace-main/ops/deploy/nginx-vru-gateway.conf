# VRU Marketplace — Nginx Configuration for VM 101 (พนักงานต้อนรับ / Gateway)
# ทำหน้าที่เป็น Reverse Proxy กระจายงานไปยัง:
#   - Frontend (VM 102 พอร์ต 3000)
#   - Backend API & WebSocket แชท (VM 103 พอร์ต 3001)

map $http_upgrade $vru_connection {
    default upgrade;
    ''      '';
}

# ชี้ไปหา VM 102 (Frontend Next.js)
upstream vru_frontend {
    server 192.168.1.102:3000;
    keepalive 16;
}

# ชี้ไปหา VM 103 (Backend NestJS)
upstream vru_api {
    server 192.168.1.103:3001;
    keepalive 16;
}

server {
    listen 80;
    # แก้เป็น Domain หรือ IP ของเครื่อง VM 101
    server_name 192.168.1.101; 

    # การตั้งค่า Proxy Headers มาตรฐาน
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 1. แชทสด (WebSocket ผ่าน Socket.IO) ส่งไปที่ Backend
    location /api/v1/socket.io/ {
        proxy_pass http://vru_api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vru_connection;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 2. เส้นทางอัปโหลดหลักฐานข้อพิพาทขนาดใหญ่ (สูงสุด 110MB)
    location ~ ^/api/v1/(orders/[^/]+/dispute|shops/me/orders/[^/]+/dispute/respond)$ {
        proxy_pass http://vru_api;
        client_max_body_size 110m;
    }

    # 3. เส้นทาง REST API ทั่วไป ส่งไปที่ Backend (สูงสุด 11MB)
    location /api/v1/ {
        proxy_pass http://vru_api;
        client_max_body_size 11m;
    }

    # ข้อความ Error 413 ขนาดไฟล์ใหญ่เกินกำหนด ตอบเป็น JSON
    error_page 413 = @payload_too_large;
    location @payload_too_large {
        default_type application/json;
        return 413 '{"code":"PAYLOAD_TOO_LARGE","message":"ไฟล์หรือข้อมูลที่ส่งมามีขนาดใหญ่เกินกำหนด"}';
    }

    # ปิดไม่ให้บุคคลภายนอกเข้าถึง Swagger Docs บน Production
    location /api/v1/docs {
        return 404;
    }

    # 4. หน้าเว็บและ Static Assets ทั้งหมด ส่งไปที่ VM 102 (Next.js)
    location / {
        proxy_pass http://vru_frontend;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $vru_connection;
    }
}
